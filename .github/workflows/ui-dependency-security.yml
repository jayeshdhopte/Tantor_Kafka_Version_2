name: UI dependency security

on:
  pull_request:
    paths:
      - tantor-ui/package.json
      - tantor-ui/package-lock.json
      - .github/workflows/ui-dependency-security.yml
  push:
    branches:
      - master
    paths:
      - tantor-ui/package.json
      - tantor-ui/package-lock.json
      - .github/workflows/ui-dependency-security.yml

permissions:
  contents: read

jobs:
  production-audit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tantor-ui
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: tantor-ui/package-lock.json
      - name: Install locked dependencies
        run: npm ci
      - name: Reject high-severity production vulnerabilities
        run: npm run audit:prod
